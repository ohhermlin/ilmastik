name: Deploy to Zone Media

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via SFTP
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KEY_PASSPHRASE: ${{ secrets.SFTP_KEY_PASSPHRASE }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          : "${SFTP_SERVER:?Add the SFTP_SERVER repository secret}"
          : "${SFTP_USERNAME:?Add the SFTP_USERNAME repository secret}"
          : "${SFTP_PRIVATE_KEY:?Add the SFTP_PRIVATE_KEY repository secret}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SFTP_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          if [ -n "$SFTP_KEY_PASSPHRASE" ]; then
            printf '#!/bin/sh\nprintf "%%s\\n" "$SFTP_KEY_PASSPHRASE"\n' > ~/.ssh/askpass
            chmod 700 ~/.ssh/askpass
            DISPLAY=:0 SSH_ASKPASS_REQUIRE=force SSH_ASKPASS="$HOME/.ssh/askpass" \
              ssh-add ~/.ssh/deploy_key < /dev/null
          else
            ssh-add ~/.ssh/deploy_key
          fi

          remote_path="${SFTP_REMOTE_PATH:-/htdocs}"
          case "$remote_path" in
            /*) ;;
            *) echo "SFTP_REMOTE_PATH must be an absolute path" >&2; exit 2 ;;
          esac

          printf 'set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i %s/.ssh/deploy_key"\nset cmd:fail-exit yes\nset net:max-retries 2\nset net:timeout 30\n' \
            "$HOME" > ~/.lftprc

          {
            printf '%s\n' 'set cmd:fail-exit yes' 'set net:max-retries 2' 'set net:timeout 30'
            printf 'mkdir -p "%s"\n' "$remote_path"
            printf 'mirror --reverse --verbose --exclude-glob .git* --exclude-glob .github* ./ "%s/"\n' "$remote_path"
            printf '%s\n' 'bye'
          } | lftp -u "${SFTP_USERNAME}," "sftp://${SFTP_SERVER}"
