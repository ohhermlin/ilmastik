```
`name: Deploy to Zone Media`


`on:`

`  push:`

`    branches:`

`      - main`


`jobs:`

`  deploy:`

`    runs-on: ubuntu-latest`

`    steps:`

`      - uses: actions/checkout@v4`


`      - name: Install lftp`

`        run: sudo apt-get install -y lftp`


`      - name: Setup SSH key`

`        run: |`

`          mkdir -p ~/.ssh`

`          echo "$\{\{ secrets.SFTP\_PRIVATE\_KEY \}\}" \> ~/.ssh/deploy\_key`

`          chmod 600 ~/.ssh/deploy\_key`


`      - name: Deploy via SFTP`

`        run: |`

`          lftp -u $\{\{ secrets.SFTP\_USERNAME \}\}, sftp://$\{\{ secrets.SFTP\_SERVER \}\} \<\<'EOF'`

`          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -i ~/.ssh/deploy\_key"`

`          set net:max-retries 3`

`          mirror --reverse --delete --exclude-glob .git\* --exclude-glob .github\* . /data01/virt119213/domeenid/[www.sinudomeem.tld/alamkaustanimi`](http://www.sinudomeem.tld/alamkaustanimi)

`          bye`

`          EOF`
```

